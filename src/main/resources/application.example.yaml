server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity_service
              uri: http://localhost:8080
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Gateway-Token, ${app.gateway-token}
            - id: profile_service
              uri: http://localhost:8081
              predicates:
                - Path=${app.api-prefix}/profile/users/**
              filters:
                - StripPrefix=2
            - id: notification_service
              uri: http://localhost:8082
              predicates:
                - Path=${app.api-prefix}/notification/**
              filters:
                - StripPrefix=2
            - id: post_service
              uri: http://localhost:8083
              predicates:
                - Path=${app.api-prefix}/post/**
              filters:
                - StripPrefix=2
            - id: file_service
              uri: http://localhost:8084
              predicates:
                - Path=${app.api-prefix}/file/**
              filters:
                - StripPrefix=2
            - id: chat_service
              uri: http://localhost:8085
              predicates:
                - Path=${app.api-prefix}/chat/**
              filters:
                - StripPrefix=2

logging:
  level:
    com.zaxxer.hikari:
    org.hibernate.engine.jdbc.connections.internal:
    org.hibernate.orm.connections.pooling:

web:
  url:

app:
  api-prefix: /api/v1
  gateway-token:
  services:
    identity-service:
      url: http://localhost:8080
    profile-service:
      url: http://localhost:8081
    notification-service:
      url: http://localhost:8082
    post-service:
      url: http://localhost:8083
    file-service:
      url: http://localhost:8084
    chat-service:
      url: http://localhost:8085
