plugins {
	id 'java'
	id 'org.springframework.boot' version "${bootVersion}"
	id 'io.spring.dependency-management' version "${depMgtVersion}"
    id 'io.freefair.lombok' version "${freefairLombokVersion}"
    id 'jacoco'
    id 'com.diffplug.spotless' version "${spotlessVersion}"
}

group = sysGroup
version = sysVersion

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}

    configureEach {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    testRuntimeOnly "org.apache.logging.log4j:log4j-core"
    testRuntimeOnly "org.apache.logging.log4j:log4j-jul"
    testRuntimeOnly "org.apache.logging.log4j:log4j-slf4j-impl"

    compileOnly "com.sun.xml.bind:jaxb-osgi:${jaxbOsgiVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.glassfish.jaxb:jaxb-runtime'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.register('installLocalGitHook', Copy) {
    from file("$rootProject.rootDir/scripts/pre-commit")
    into file("$rootProject.rootDir/.git/hooks")
    filePermissions { permissions ->
        permissions.user.read = true
        permissions.user.write = true
        permissions.group.read = true
        permissions.other.read = true
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('installLocalGitHook')
}

tasks.named('build') {
    dependsOn 'spotlessApply'
}

tasks.named('test') {
	useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}", '-Xshare:off'
}

jacoco {
    toolVersion = jacocoVersion
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect(({
            fileTree(dir: it, exclude: [
                    'com/dongpv/sns/gateway/dto/**',
                    'com/dongpv/sns/gateway/entity/**',
                    'com/dongpv/sns/gateway/mapper/**',
                    'com/dongpv/sns/gateway/configuration/**'
            ])
        } as Closure<Object>))))
    }
}

spotless {
    java {
        removeUnusedImports()
        toggleOffOn()
        trimTrailingWhitespace()
        endWithNewline()
        leadingSpacesToTabs()
        palantirJavaFormat()
        importOrder("java", "jakarta", "org", "com", "com.diffplug")
    }
}
